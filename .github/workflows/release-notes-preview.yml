name: Release Notes Preview

on:
  push:
    branches:
      - qa
      - "release/**"

jobs:
  preview:
    name: Generate Release Notes Preview
    runs-on: ubuntu-latest
    # Avoid re-running when this workflow pushes its own preview commit.
    # Do NOT put [skip ci] in that commit — it also skips Release Pipeline
    # when the release branch is later merged into dev.
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Release Notes Preview
        run: node ./scripts/release-notes-preview.js

      - name: Upload Release Notes Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-preview
          path: RELEASE_NOTES_PREVIEW.md
          if-no-files-found: error

      - name: Commit preview file to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add RELEASE_NOTES_PREVIEW.md

          if git diff --staged --quiet; then
            echo "No changes to RELEASE_NOTES_PREVIEW.md"
            exit 0
          fi

          git commit -m "chore: update RELEASE_NOTES_PREVIEW.md"
          git push

      # QA-facing Jira RC — only when merging into qa (not on every release/** push)
      - name: Create Jira Preview Release (RC)
        if: github.ref == 'refs/heads/qa'
        env:
          JIRA_SERVER_URL: ${{ secrets.JIRA_SERVER_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SEMANTIC_RELEASE_JIRA_SERVER_URL: ${{ secrets.JIRA_SERVER_URL }}
          SEMANTIC_RELEASE_JIRA_USERNAME: ${{ secrets.JIRA_USER_EMAIL }}
          SEMANTIC_RELEASE_JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          VERSION=$(node -e "
            const fs = require('fs');
            const text = fs.readFileSync('RELEASE_NOTES_PREVIEW.md', 'utf8');
            const match = text.match(/Expected Release Version:\\s*v?(\\d+\\.\\d+\\.\\d+)/i);
            if (!match) {
              console.error('Could not parse Expected Release Version from RELEASE_NOTES_PREVIEW.md');
              process.exit(1);
            }
            console.log(match[1]);
          ")
          echo "Base version for Jira RC: $VERSION"
          node ./scripts/jira-release.js "$VERSION" --preview
