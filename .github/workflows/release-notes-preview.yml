name: Release Notes Preview

on:
  push:
    branches:
      - "release/**"

jobs:
  preview:
    name: Generate Release Notes Preview
    runs-on: ubuntu-latest
    # Avoid re-running when this workflow pushes its own preview commit.
    # Do NOT put [skip ci] in that commit — it also skips Release Pipeline
    # when the release branch is later merged into dev.
    if: github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Release Notes Preview
        run: node ./scripts/release-notes-preview.js

      - name: Upload Release Notes Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-preview
          path: RELEASE_NOTES_PREVIEW.md
          if-no-files-found: error

      - name: Commit preview file to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add RELEASE_NOTES_PREVIEW.md

          if git diff --staged --quiet; then
            echo "No changes to RELEASE_NOTES_PREVIEW.md"
            exit 0
          fi

          git commit -m "chore: update RELEASE_NOTES_PREVIEW.md"
          git push
